<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Road Renegade - Free US Geography Route Planning Game
    </title>

    <meta
        name="description"
        content="Escape across the United States by connecting cities, avoiding wanted states, and completing required detours in this free browser geography game."
    >

    <!-- Open Graph -->

    <meta
        property="og:title"
        content="Road Renegade"
    >

    <meta
        property="og:description"
        content="Can you escape across America while avoiding wanted states?"
    >

    <meta
        property="og:type"
        content="website"
    >

    <!-- Styles -->

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Leaflet -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <!-- Google Analytics -->

    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-7LY11Q5N0B"
    ></script>

    <script>

        window.dataLayer =
            window.dataLayer || [];

        function gtag(){
            dataLayer.push(arguments);
        }

        gtag(
            "js",
            new Date()
        );

        gtag(
            "config",
            "G-7LY11Q5N0B"
        );

    </script>

    <!-- AdSense -->

    <script
        async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2129073346993901"
        crossorigin="anonymous"
    ></script>

</head>
<body>

    <h1>Road Renegade</h1>

    <p>
        Escape across the United States while avoiding wanted states and
        completing required detours.
    </p>

    <!-- LOGIN SCREEN -->

    <div id="loginScreen">

        <button id="googleBtn">
            Sign In With Google
        </button>

    </div>

    <div id="aliasScreen" style="display:none">

    <h2>Choose Your Alias</h2>

    <input
        id="aliasInput"
        maxlength="20"
    >

    <button id="createAliasBtn">
        Become Wanted
    </button>

</div>
    <!-- SETUP SCREEN -->

    <div id="setup" style="display:none">

        <input
            type="checkbox"
            id="learningMode"
        >
        Learning Mode

        <br><br>

        <label>
            Fuel Range
            <select id="fuelSelect">
                <option value="200">200 (Hard)</option>
                <option value="300" selected>300 (Normal)</option>
                <option value="400">400 (Easy)</option>
                <option value="500">500 (Very Easy)</option>
            </select>
        </label>

        <br><br>
    
        <label>
            Detours
            <select id="detourSelect">
                <option>0</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </label>

        <br><br>

<label>
    Wanted States
    <select id="blockedSelect">
        <option>0</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
    </select>
</label>

        <br><br>
        
        <button id="startBtn">
            Start Escape
        </button>

    </div>

    <!-- GAME SCREEN -->

    <div id="game" style="display:none">

        <div id="directions"></div>

        <input
            id="cityInput"
            list="citySuggestions"
        >

        <datalist id="citySuggestions"></datalist>

        <button id="enter">
            Enter City
        </button>

        <div id="map"></div>

    </div>

</body>

    <script type="module"src="sketch.js"></script>
    <script type="module" src="firebase.js"></script>
</html>
