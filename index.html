<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <link rel="stylesheet" href="style.css">

    <title>Road Renegade</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2129073346993901"
     crossorigin="anonymous"></script>
</head>
<body>
    <div id="setup">

    <h1>ROAD RENEGADE</h1>

    <p>
        Escape across the United States while avoiding wanted states and
        completing required detours.
    </p>
    <input type="checkbox" id="learningMode">Learning Mode</label>
    <label>
        Fuel Range
        <select id="fuelSelect">
            <option value="200">200 (Hard)</option>
            <option value="300" selected>300 (Normal)</option>
            <option value="400">400 (Easy)</option>
            <option value="500">500 (Very Easy)</option>
        </select>
    </label>

    <br><br>

    <label>
        Detours
        <select id="detourSelect">
            <option>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
        </select>
    </label>

    <br><br>

    <label>
        Wanted States
        <select id="blockedSelect">
            <option>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
        </select>
    </label>

    <br><br>

    <button id="startBtn">
        Start Escape
    </button>

</div>
  <p id="directions"></p>
  <button id="tutorialBtn" onclick="showTutorial()"> 
    How To Play
</button><br><br>
  <input id="cityInput" placeholder="Where to next?"><button id="enter">Enter</button>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="sketch.js"></script>
  <footer>
    <a href="about.html">About</a> |
    <a href="contact.html">Contact</a> |
    <a href="privacy-policy.html">Privacy Policy</a>
</footer>
</body>
</html>
