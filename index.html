<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        JSDev
    </title>

    <meta
        name="description"
        content="Free browser games, coding projects, experiments, and interactive experiences built by JSDev."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-7LY11Q5N0B"
    ></script>

    <script>

        window.dataLayer =
            window.dataLayer || [];

        function gtag(){
            dataLayer.push(arguments);
        }

        gtag(
            "js",
            new Date()
        );

        gtag(
            "config",
            "G-7LY11Q5N0B"
        );

    </script>

    <script

<body>

    <main>

        <h1>
            JSDev
        </h1>

        <p>
            Independent browser games, coding projects,
            and interactive experiments.
        </p>

        <button
            id="playBtn"
            onclick="
                location.href=
                '/road-renegade/play.html'
            "
        >
            Play Road Renegade
        </button>

        <button
            id="applyBtn"
            onclick="
                location.href='https://forms.gle/CL2D1GBYFt7cgzEj8'
            "
        >
            Join The Team
        </button>

        <p>
            Interested in testing games, making dev art,
            sharing ideas, or helping shape future projects?
            We'd love to hear from you.
        </p>

        <script>

            document
                .getElementById(
                    "playBtn"
                )
                .addEventListener(
                    "click",
                    function(){

                        gtag(
                            "event",
                            "entered_road_renegade"
                        );

                    }
                );

            document
                .getElementById(
                    "applyBtn"
                )
                .addEventListener(
                    "click",
                    function(){

                        gtag(
                            "event",
                            "team_application_click"
                        );

                    }
                );

        </script>
