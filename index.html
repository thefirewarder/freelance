<body>

    <h1>Road Renegade</h1>

    <p>
        Escape across the United States while avoiding wanted states and
        completing required detours.
    </p>

    <!-- LOGIN SCREEN -->

    <div id="loginScreen">

        <button id="googleBtn">
            Sign In With Google
        </button>

    </div>

    <!-- SETUP SCREEN -->

    <div id="setup" style="display:none">

        <input
            type="checkbox"
            id="learningMode"
        >
        Learning Mode

        <br><br>

        <label>
            Fuel Range
            <select id="fuelSelect">
                <option value="200">200 (Hard)</option>
                <option value="300" selected>300 (Normal)</option>
                <option value="400">400 (Easy)</option>
                <option value="500">500 (Very Easy)</option>
            </select>
        </label>

        <br><br>

        <label>
            Detours
            <select id="detourSelect">
                <option>0</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </label>

        <br><br>

        <button id="startBtn">
            Start Escape
        </button>

    </div>

    <!-- GAME SCREEN -->

    <div id="game" style="display:none">

        <div id="directions"></div>

        <input
            id="cityInput"
            list="citySuggestions"
        >

        <datalist id="citySuggestions"></datalist>

        <button id="enter">
            Enter City
        </button>

        <div id="map"></div>

    </div>

</body>
